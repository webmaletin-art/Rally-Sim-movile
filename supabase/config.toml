# Configuración de Supabase para Dream Racing (carpeta que lee la integración con GitHub y la CLI).
# El ID del proyecto NO va acá: se pasa con el secreto SUPABASE_PROJECT_ID (ver docs/ONLINE_SUPABASE.md).
project_id = "dream-racing"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
major_version = 15

[auth]
enabled = true
# Desde octubre de 2026 la cuenta con correo es obligatoria para jugar y el juego ya no crea usuarios anónimos: «Allow anonymous sign-ins» queda APAGADO (Authentication → Sign In / Providers).
enable_anonymous_sign_ins = false
enable_signup = true
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
# Cuenta con correo y contraseña (obligatoria para jugar). Con «Confirm email» apagado la cuenta anda al toque; si se enciende hace falta un SMTP propio (ver docs/ONLINE_SUPABASE.md).
enable_signup = true
enable_confirmations = false
double_confirm_changes = false
secure_password_change = false

