name: Supabase · cuenta de revisión de Google Play

# Crea (una sola vez) la cuenta EXCLUSIVA para los revisores de Google Play y la verifica. Usa los mecanismos administrativos que ya existen: la API de administración de Auth (crea el usuario con el correo
# ya confirmado SÓLO para esa cuenta, sin tocar la configuración global), `account_admin_grant` (saldo) y `account_iap_grant` (el desbloqueo «Juego completo», para que Google pueda ver el contenido de pago
# sin hacer compras reales). No toca a ningún otro usuario, ni el código, ni los productos ni los precios.
# El repositorio es PÚBLICO: la contraseña NO se imprime. Se genera acá, se cifra con la clave PÚBLICA que se pasa en «pubkey_b64» y sólo se imprime el texto cifrado (lo descifra quien tiene la clave privada).
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Correo de la cuenta de revisión'
        default: 'roldanhr98+revision-google@gmail.com'
      pubkey_b64:
        description: 'Clave PÚBLICA RSA (PEM en base64) para cifrar la contraseña generada'
        required: true
      credits:
        description: 'Saldo inicial (monedas del juego)'
        default: '150000'

permissions:
  contents: read

concurrency:
  group: supabase-cuenta-revision
  cancel-in-progress: false

jobs:
  cuenta:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      EMAIL: ${{ inputs.email }}
      PUBKEY_B64: ${{ inputs.pubkey_b64 }}
      CREDITS: ${{ inputs.credits }}
    steps:
      - name: Comprobaciones
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secreto $v"; exit 1; fi
          done
          case "$EMAIL" in *@*.*) ;; *) echo "::error::Correo inválido"; exit 1;; esac
          case "$CREDITS" in ''|*[!0-9]*) echo "::error::El saldo debe ser un número"; exit 1;; esac
          echo "Proyecto Supabase: ${SUPABASE_PROJECT_ID:0:4}… · URL: ${SUPABASE_URL%%.*}…"
      - name: Clave de administración y contraseña (no se imprimen)
        run: |
          set +x
          SK=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys?reveal=true" | jq -r '.[] | select(.name=="service_role") | .api_key' | head -1)
          if [ -z "$SK" ] || [ "$SK" = "null" ]; then echo "::error::No se pudo obtener la clave de administración con el token disponible"; exit 1; fi
          echo "::add-mask::$SK"
          PW=$(openssl rand -base64 33 | tr -d '/+=' | head -c 22)Aa1!
          echo "::add-mask::$PW"
          echo "SK=$SK" >> "$GITHUB_ENV"
          echo "PW=$PW" >> "$GITHUB_ENV"
          echo "$PUBKEY_B64" | base64 -d > /tmp/pub.pem
          printf '%s' "$PW" | openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -pkeyopt rsa_padding_mode:oaep | base64 -w0 > /tmp/pw.enc
          echo "Contraseña generada y cifrada (se imprime más abajo sólo el texto cifrado)."
      - name: Crear el usuario (sólo esta cuenta queda confirmada)
        run: |
          code=$(curl -sS -o /tmp/created.json -w '%{http_code}' -X POST "$SUPABASE_URL/auth/v1/admin/users" -H "apikey: $SK" -H "Authorization: Bearer $SK" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg e "$EMAIL" --arg p "$PW" '{email:$e,password:$p,email_confirm:true,user_metadata:{purpose:"google-play-review"}}')")
          echo "Auth admin → HTTP $code"
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then jq -r '.msg // .message // .error_description // .error // .' /tmp/created.json | head -c 300; echo; echo "::error::No se creó el usuario (si ya existe, no se toca)"; exit 1; fi
          echo "Usuario creado: id $(jq -r .id /tmp/created.json | cut -c1-8)… · confirmado: $(jq -r '.email_confirmed_at != null' /tmp/created.json)"
      - name: Saldo y contenido de pago (mecanismos administrativos existentes)
        run: |
          q() { curl -sS -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$(jq -nc --arg q "$1" '{query:$q}')"; }
          UID_=$(jq -r .id /tmp/created.json)
          echo "account_admin_grant: $(q "select public.account_admin_grant('$EMAIL', $CREDITS) ->> 'credits'")"
          echo "account_iap_grant dr_full: $(q "select public.account_iap_grant('$UID_'::uuid, 'dr_full', 'play-review-account-grant-0001') ->> 'granted'")"
      - name: Verificar el inicio de sesión y lo que ve el juego
        run: |
          code=$(curl -sS -o /tmp/login.json -w '%{http_code}' -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' -d "$(jq -nc --arg e "$EMAIL" --arg p "$PW" '{email:$e,password:$p}')")
          echo "Inicio de sesión con correo y contraseña → HTTP $code"
          [ "$code" = "200" ] || { jq -r '.msg // .error_description // .' /tmp/login.json | head -c 300; echo "::error::No pudo iniciar sesión"; exit 1; }
          TK=$(jq -r .access_token /tmp/login.json); echo "::add-mask::$TK"
          echo "Correo confirmado: $(jq -r '.user.email_confirmed_at != null' /tmp/login.json)"
          code=$(curl -sS -o /tmp/state.json -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/account_state" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $TK" -H 'Content-Type: application/json' -d '{}')
          echo "account_state (lo que lee el juego al abrir) → HTTP $code"
          jq -r '"  créditos: \(.credits) · vale de taller: \(.voucher) · compras desbloqueadas: \((.iap // {}) | keys | join(", ")) · autos en el servidor: \((.cars // {}) | keys | length)"' /tmp/state.json
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$SUPABASE_URL/rest/v1/rpc/app_flags" -X POST -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $TK" -H 'Content-Type: application/json' -d '{}')
          echo "app_flags → HTTP $code"
      - name: Contraseña (cifrada)
        run: |
          echo "CONTRASENA_CIFRADA_RSA_OAEP_BASE64:"
          cat /tmp/pw.enc; echo
