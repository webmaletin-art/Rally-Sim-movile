name: Build Godot APK

# Versión Godot de GSkorp Rally. Genera:
#  · APK LIVIANO  (gskorp-light.apk): solo el motor + la pantalla de arranque. Al abrirlo baja el juego (content.pck).
#  · content.pck (todo menos las carrocerías) + cars.pck (las carrocerías de los autos con textura, sin reducir, ~500 MB) + manifest.json:
#    se publican en la release "godot-content-4.5" (una por versión del motor); el APK liviano los descarga solo. cars.pck solo se vuelve a bajar si cambia (su versión es su hash).
#  · (el APK «completo» con todo adentro ya no se arma: pesaría más de 600 MB)
# Cada vez que se actualiza el contenido, el APK liviano NO hay que reinstalarlo: al abrir baja lo nuevo.
on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/build-godot.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.1
  # El contenido (content.pck + cars.pck) lo tiene que armar la MISMA versión del motor que corre el APK (los paquetes cambian de formato entre versiones): una release por versión (menor) del motor.
  # El APK liviano arma el nombre solo (bootstrap/boot.gd, Engine.get_version_info()); los APK viejos (4.4) siguen leyendo «godot-content», que ya no se actualiza.
  CONTENT_TAG: godot-content-4.5

jobs:
  # Las pruebas corren en paralelo y NO frenan la compilación del APK (si fallan, el job queda en rojo y se mira el log).
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot y plantillas de exportación
        run: |
          set -e
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          rm -f godot.zip
          godot --headless --version

      - name: Importar recursos
        working-directory: godot
        run: |
          godot --headless --import || true
          godot --headless --import || true

      - name: Pruebas (física contra la versión HTML, IA, suavidad, controles)
        working-directory: godot
        run: |
          timeout -k 5 600 godot --headless --script res://tests/scripts_parse_test.gd
          timeout -k 5 120 godot --headless --script res://tests/crash_log_test.gd
          timeout -k 5 600 godot --headless --script res://tests/police_test.gd
          timeout -k 5 900 godot --headless --script res://tests/ow_events_test.gd
          timeout -k 5 600 godot --headless --script res://tests/sectors_test.gd
          timeout -k 5 120 godot --headless --script res://tests/city_reach_test.gd
          timeout -k 5 300 godot --headless --script res://tests/region_threads_test.gd
          timeout -k 5 300 godot --headless --script res://tests/cabin_shake_test.gd
          timeout -k 5 300 godot --headless --script res://tests/cabin_dash_test.gd
          timeout -k 5 300 godot --headless --script res://tests/frame_res_test.gd
          timeout -k 5 300 godot --headless --script res://tests/tombstone_test.gd
          timeout -k 5 300 godot --headless --script res://tests/boot_download_test.gd
          timeout -k 5 300 godot --headless --script res://tests/cosmetics_test.gd
          timeout -k 5 600 godot --headless --script res://tests/physics_test.gd
          timeout -k 5 600 godot --headless --script res://tests/ai_test.gd
          timeout -k 5 600 godot --headless --script res://tests/interp_test.gd
          timeout -k 5 600 godot --headless --script res://tests/controls_test.gd
          timeout -k 5 600 godot --headless --script res://tests/track_test.gd
          timeout -k 5 600 godot --headless --script res://tests/build_test.gd
          timeout -k 5 600 godot --headless --script res://tests/ai_route_test.gd
          timeout -k 5 600 godot --headless --script res://tests/rewards_test.gd
          timeout -k 5 600 godot --headless --script res://tests/wall_test.gd
          timeout -k 5 600 godot --headless --script res://tests/adv_route_test.gd
          timeout -k 5 600 godot --headless --script res://tests/cars_test.gd
          timeout -k 5 600 godot --headless --script res://tests/drift_test.gd
          timeout -k 5 600 godot --headless --script res://tests/practice_test.gd
          timeout -k 5 600 godot --headless --script res://tests/paper_test.gd
          timeout -k 5 600 godot --headless --script res://tests/release_test.gd
          timeout -k 5 600 godot --headless --script res://tests/menu_ui_test.gd -- --menu --noconsent
          timeout -k 5 600 godot --headless --script res://tests/map_data_test.gd
          timeout -k 5 600 godot --headless --script res://tests/custom_route_test.gd
          timeout -k 5 900 godot --headless --script res://tests/map_v3_test.gd
          timeout -k 5 600 godot --headless --script res://tests/net_test.gd
          timeout -k 5 900 godot --headless --script res://tests/net_chase_test.gd
          python3 ../tools/route_gen/validate_all.py
          timeout -k 5 600 godot --headless --script res://tests/drag_test.gd
          timeout -k 5 600 godot --headless --script res://tests/dream_test.gd
          timeout -k 5 600 godot --headless --script res://tests/fantasy_test.gd
          timeout -k 5 600 godot --headless --script res://tests/city_test.gd
          timeout -k 5 600 godot --headless --script res://tests/ow_opt_test.gd
          timeout -k 5 600 godot --headless --script res://tests/autotune_test.gd
          timeout -k 5 600 godot --headless --script res://tests/world_life_test.gd
          timeout -k 5 600 godot --headless --script res://tests/parts_test.gd
          timeout -k 5 600 godot --headless --script res://tests/traffic_graph_test.gd
          timeout -k 5 600 godot --headless --script res://tests/parked_cars_test.gd
          timeout -k 5 600 godot --headless --script res://tests/civil_traffic_test.gd
          timeout -k 5 600 godot --headless --script res://tests/traffic_routine_test.gd
          timeout -k 5 600 godot --headless --script res://tests/guardrail_test.gd
          timeout -k 5 600 godot --headless --script res://tests/tire_wear_test.gd
          timeout -k 5 600 godot --headless --script res://tests/surfaces_test.gd
          timeout -k 5 600 godot --headless --script res://tests/activities_test.gd
          timeout -k 5 600 godot --headless --script res://tests/world_weather_test.gd
          timeout -k 5 600 godot --headless --script res://tests/online_profile_test.gd
          timeout -k 5 600 godot --headless --script res://tests/remote_cars_test.gd
          timeout -k 5 600 godot --headless --script res://tests/remote_motion_test.gd
          timeout -k 5 600 godot --headless --script res://tests/realtime_test.gd
          timeout -k 5 600 godot --headless --script res://tests/region_test.gd
          timeout -k 5 900 godot --headless --script res://tests/region_drive_test.gd
          timeout -k 5 900 godot --headless --script res://tests/open_world_access_test.gd
          timeout -k 5 900 godot --headless --script res://tests/region_junction_test.gd
          timeout -k 5 900 godot --headless --script res://tests/region_connectors_test.gd
          timeout -k 5 900 godot --headless --script res://tests/region_terrain_test.gd
          timeout -k 5 900 godot --headless --script res://tests/region_polish_test.gd
          timeout -k 5 600 godot --headless --script res://tests/spawn_menu_test.gd -- --menu --noconsent
          timeout -k 5 600 godot --headless --script res://tests/language_test.gd
          timeout -k 5 600 godot --headless --script res://tests/music_test.gd
          timeout -k 5 600 godot --headless --script res://tests/login_wall_test.gd
          timeout -k 5 600 godot --headless --script res://tests/account_econ_test.gd
          timeout -k 5 600 godot --headless --script res://tests/world_ambient_test.gd
          timeout -k 5 600 godot --headless --script res://tests/audio_levels_test.gd
          timeout -k 5 600 godot --headless --script res://tests/ambient_peds_test.gd
          timeout -k 5 600 godot --headless --script res://tests/world_budget_test.gd
          timeout -k 5 900 godot --headless --script res://tests/travesia_test.gd -- --km=10.5
          timeout -k 5 600 godot --headless --script res://tests/travesia_test.gd -- --from=18.5 --km=4
          timeout -k 5 600 godot --headless --script res://tests/vegbench_test.gd

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.1 platforms;android-35'

      - name: Instalar Godot y plantillas de exportación
        run: |
          set -e
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o tpz.zip $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          dir=$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $dir
          unzip -q -j tpz.zip 'templates/android_*' 'templates/version.txt' -d $dir
          rm -f tpz.zip godot.zip
          ls -la $dir
          godot --headless --version

      - name: Configurar Godot (SDK de Android y firma)
        run: |
          mkdir -p $HOME/.config/godot
          cat > $HOME/.config/godot/editor_settings-4.5.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/godot/keystore/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat $HOME/.config/godot/editor_settings-4.5.tres

      - name: Importar recursos
        working-directory: godot
        run: |
          godot --headless --import || true
          godot --headless --import || true

      - name: Configurar el modo online (Supabase)
        working-directory: godot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # La dirección y la clave PÚBLICA (anon) van dentro de la app; la seguridad la dan las políticas de la base. Sin secretos queda apagado.
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            python3 -c "import json,os,urllib.parse as u; p=u.urlparse(os.environ['SUPABASE_URL'].strip()); json.dump({'url': p.scheme+'://'+p.netloc, 'anon_key': os.environ['SUPABASE_ANON_KEY'].strip()}, open('game/online/online_config.json','w'))"
            echo "Modo online configurado (${SUPABASE_URL%%.*}…)"
          else
            echo "Sin secretos de Supabase: el modo online queda apagado en esta compilación."
          fi

      - name: Número de versión del APK (sube con cada compilación)
        working-directory: godot
        run: |
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.${GITHUB_RUN_NUMBER}\"/" export_presets.cfg
          grep -n "^version/" export_presets.cfg
          echo "r${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" > game/build_id.txt

      - name: Exportar APK liviano y contenido (content.pck + cars.pck)
        working-directory: godot
        env:
          # versión "release" del motor (más rápida que la de depuración); misma clave de firma fija
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/godot/keystore/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p ../build
          python3 ../tools/export/split_presets.py
          godot --headless --export-release "Android Light" ../build/gskorp-light.apk
          godot --headless --export-pack "Content" ../build/content.pck
          godot --headless --export-pack "Cars" ../build/cars.pck
          python3 ../tools/export/check_pck.py ../build/content.pck
          ls -la ../build

      - name: Manifiesto del contenido
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          def sha(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(1 << 20), b''):
                      h.update(chunk)
              return h.hexdigest()
          ver = "r%s-%s" % (os.environ['GITHUB_RUN_NUMBER'], os.environ['GITHUB_SHA'][:7])
          repo = os.environ['GITHUB_REPOSITORY']
          base = "https://github.com/%s/releases/download/%s/" % (repo, os.environ['CONTENT_TAG'])
          # La versión de los autos sale de SUS ARCHIVOS de origen (no del hash del .pck, que cambia en cada armado aunque los autos sean los mismos): así el teléfono no
          # vuelve a bajar ~600 MB con cada actualización. Si el manifiesto publicado ya tiene esa versión se reusa su entrada y no se vuelve a subir cars.pck.
          import subprocess, urllib.request
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD:godot/game/models/cars']).decode().strip()
          presets = hashlib.sha256(open('tools/export/split_presets.py', 'rb').read()).hexdigest()[:8]
          cars_ver = "%s-%s-%s" % (tree[:12], presets, os.environ.get('GODOT_VERSION', ''))
          cars = None
          try:
              old = json.load(urllib.request.urlopen(base + "manifest.json", timeout=30))
              for q in old.get("packs", []):
                  if q.get("name") == "cars" and q.get("version") == cars_ver:
                      cars = q
          except Exception as e:
              print("sin manifiesto anterior:", e)
          if cars is None:
              cars_sha = sha('build/cars.pck')
              cars = {"name": "cars", "version": cars_ver, "url": base + "cars.pck", "size": os.path.getsize('build/cars.pck'), "sha256": cars_sha}
              open('build/cars_new', 'w').write('1')
          else:
              print("autos sin cambios (%s): se reusa el cars.pck publicado" % cars_ver)
          json.dump({
              "version": ver,
              "url": base + "content.pck",
              "size": os.path.getsize('build/content.pck'),
              "sha256": sha('build/content.pck'),
              "packs": [cars],
          }, open('build/manifest.json', 'w'), indent=1)
          print(open('build/manifest.json').read())
          PY

      - name: Publicar el contenido (lo descarga el APK liviano)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $CONTENT_TAG >/dev/null 2>&1 || gh release create $CONTENT_TAG \
            --title "Contenido del juego (Godot ${GODOT_VERSION%.*})" \
            --notes "Paquete que descarga solo la app liviana al abrirse (motor ${GODOT_VERSION%.*}). No hace falta bajarlo a mano." \
            --prerelease
          # cars.pck (~600 MB) solo se vuelve a subir si los autos cambiaron (si no, el publicado sigue valiendo y los teléfonos no lo bajan de nuevo)
          if [ -f build/cars_new ]; then gh release upload $CONTENT_TAG build/cars.pck --clobber; fi
          gh release upload $CONTENT_TAG build/content.pck build/manifest.json --clobber

      - name: Publicar los APK (link directo para instalar, sin iniciar sesión)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view godot-apk >/dev/null 2>&1 || gh release create godot-apk \
            --title "APK de Dream Racing (para instalar)" \
            --notes "Instalá DreamRacing-liviano.apk (baja el juego solo al abrirse; la primera vez baja también los autos, unos 500 MB)." \
            --prerelease
          cp build/gskorp-light.apk build/DreamRacing-liviano.apk
          gh release upload godot-apk build/DreamRacing-liviano.apk --clobber

      - name: Subir APK liviano
        uses: actions/upload-artifact@v4
        with:
          name: gskorp-godot-LIVIANO-apk
          path: build/gskorp-light.apk
