name: Play · Prueba cerrada (alpha)

# Pone en la pista de PRUEBA CERRADA (alpha) un AAB que YA está subido a Play (p. ej. el 1007 de la pista interna), sin subir ni reconstruir nada: `tools/play/promote_alpha.py`.
# Sin «confirm» es un ENSAYO (Google valida y la edición se borra). Con confirm = ALPHA queda publicado en alpha. Sólo toca alpha (fijada en el código): no internal, beta, producción, productos, ficha ni testers.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode del bundle que ya está en Play'
        default: '1007'
      version_name:
        description: 'Nombre de la versión'
        default: '1.0.1'
      release_status:
        description: 'completed = disponible · draft = borrador (obligatorio si la app todavía está en borrador en Play: se envía a revisión desde Play Console)'
        default: 'completed'
      confirm:
        description: 'Vacío = ensayo. ALPHA = publicar en la prueba cerrada'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: play-alpha
  cancel-in-progress: false

jobs:
  alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Herramientas de Google
        run: pip install --quiet google-api-python-client google-auth google-auth-httplib2
      - name: Prueba de la herramienta
        run: python3 tools/play/tests/promote_alpha_test.py
      - name: Poner el bundle en alpha (ensayo si no se confirma)
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          CONFIRM: ${{ inputs.confirm }}
          VC: ${{ inputs.version_code }}
          VN: ${{ inputs.version_name }}
          ST: ${{ inputs.release_status }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT" ]; then echo "::error::Falta el secreto GOOGLE_PLAY_SERVICE_ACCOUNT"; exit 1; fi
          python3 tools/play/promote_alpha.py --version-code "$VC" --version-name "$VN" --status "$ST" --confirm "$CONFIRM"
