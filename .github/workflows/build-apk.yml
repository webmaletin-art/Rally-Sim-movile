name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install npm dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp "HTML base Rally GSkorp.html" www/index.html
          cp -r vendor models audio js css www/

      - name: Add Android platform
        run: npx cap add android

      - name: Fullscreen (immersive) activity
        run: |
          f=$(find android/app/src/main/java -name MainActivity.java | head -1)
          echo "Replacing $f"
          cp android-src/MainActivity.java "$f"
          # juego de autos: siempre horizontal (gira sola si das vuelta el teléfono)
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          grep -n screenOrientation android/app/src/main/AndroidManifest.xml || echo "AVISO: no se pudo fijar la orientación"
          # tema a pantalla completa desde que abre (sin barra de notificaciones ni en el arranque)
          python3 - <<'PY'
          import re
          p='android/app/src/main/res/values/styles.xml'
          s=open(p).read()
          add='<item name="android:windowFullscreen">true</item><item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>'
          s=re.sub(r'(<style name="AppTheme[^"]*"[^>]*>)',lambda m:m.group(1)+add,s)
          open(p,'w').write(s)
          print(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rally-sim-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
